name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: python -m ruff check src tests scripts
      - name: Validators (tomllib, Python 3.11+)
        if: matrix.python-version != '3.10'
        run: |
          python scripts/validate_agent_registry.py
          python scripts/validate_platform_v3.py
      - run: python -m pytest -q
      - name: Installer smoke test (isolated home)
        shell: bash
        run: |
          export AI_DLC_DATA_DIR="$RUNNER_TEMP/aidlc-data"
          python -m ai_dlc_mcp.installer install --home "$RUNNER_TEMP/home" --no-cli
          python -m ai_dlc_mcp.installer doctor --home "$RUNNER_TEMP/home"
      - name: Build and exercise one-command setup (isolated home)
        shell: bash
        run: |
          python -m pip install build uv
          python -m build --wheel
          python scripts/smoke_setup.py dist/*.whl
      - run: pip-audit --skip-editable
  typescript-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
