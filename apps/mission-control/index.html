<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI-DLC Mission Control</title>
  <style>
    :root{color-scheme:dark;--bg:#07100e;--panel:#0d1b17;--line:#214136;--ink:#eefaf5;--muted:#8cad9f;--lime:#8cffbf;--amber:#ffc86b;--red:#ff716c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12372b 0,transparent 35%),var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}header,main{max-width:1240px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line)}h1{font-size:clamp(24px,4vw,46px);letter-spacing:-.06em;margin:0}.eyebrow,.muted{color:var(--muted)}.live{color:var(--lime)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 3;background:linear-gradient(145deg,#10231d,#0a1714);border:1px solid var(--line);border-radius:12px;padding:18px;min-height:120px}.wide{grid-column:span 8}.side{grid-column:span 4}.metric{font:36px/1.1 system-ui;font-weight:700;margin-top:15px}.bar{height:6px;background:#172a24;border-radius:5px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:var(--lime);width:0;transition:.4s}.row{display:grid;grid-template-columns:minmax(180px,1fr) auto auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #183029}.actions{display:flex;gap:5px}.actions button{padding:4px 7px;font-size:11px}.actions .danger{background:var(--red)}.pill{padding:2px 8px;border:1px solid var(--line);border-radius:99px;color:var(--lime)}button{background:var(--lime);color:#062016;border:0;padding:10px 15px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}@media(max-width:800px){.card,.wide,.side{grid-column:1/-1}header{align-items:start;gap:18px;flex-direction:column}.row{grid-template-columns:1fr}.actions{margin-bottom:8px}}
  </style>
</head>
<body><header><div><div class="eyebrow">AGENTSHIELD / OPERATIONS</div><h1>Mission Control</h1></div><div><span class="live">● LIVE</span> <span id="stamp" class="muted">connecting</span></div></header>
<main><section class="grid"><article class="card"><div class="muted">MEMORIES</div><div class="metric" id="memories">—</div><div class="bar"><i id="mbar"></i></div></article><article class="card"><div class="muted">RUNNING SWARMS</div><div class="metric" id="running">—</div></article><article class="card"><div class="muted">ACTIVE NODES</div><div class="metric" id="nodes">—</div></article><article class="card"><div class="muted">SYSTEM</div><div class="metric live">NOMINAL</div></article><article class="card wide"><div class="muted">SWARM FLIGHT BOARD</div><div id="swarms"><p class="muted">No swarms reported.</p></div></article><article class="card side"><div class="muted">ASSURANCE</div><h2>Bounded autonomy</h2><p class="muted">Persistent leases, explicit lifecycle controls, tenant isolation and auditable state transitions are active.</p><button onclick="refresh()">Refresh telemetry</button></article></section></main>
<script>
const get=async p=>{const r=await fetch(p,{headers:token?{authorization:`Bearer ${token}`}:{}});if(r.status===401&&!token){const entered=prompt('Mission Control access token');if(entered){sessionStorage.setItem('agentshieldToken',entered);location.reload()}throw Error(401)}if(!r.ok)throw Error(r.status);return r.json()},token=sessionStorage.getItem('agentshieldToken')||'';
async function command(id,action){if(!confirm(`${action} swarm ${id}?`))return;const r=await fetch(`/api/swarms/${encodeURIComponent(id)}/${action}`,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:`Bearer ${token}`}:{})},body:JSON.stringify({reason:'Mission Control operator'})});if(!r.ok)alert(`Command failed: ${r.status}`);await refresh()}
async function refresh(){try{const [o,s]=await Promise.all([get('/api/overview'),get('/api/swarms')]);const memories=o.memory.memories||0;document.querySelector('#memories').textContent=memories;document.querySelector('#running').textContent=o.swarms.running||0;document.querySelector('#nodes').textContent=o.federation.active||0;document.querySelector('#mbar').style.width=Math.min(100,memories/10)+'%';document.querySelector('#stamp').textContent=new Date().toLocaleTimeString();document.querySelector('#swarms').innerHTML=s.length?s.map(x=>`<div class="row"><strong>${esc(x.objective)}</strong><span>${esc(x.project_id)}</span><span class="pill">${esc(x.status)}</span><span class="actions">${x.status==='running'?`<button onclick="command('${esc(x.id)}','pause')">Pause</button>`:''}${x.status==='paused'?`<button onclick="command('${esc(x.id)}','resume')">Resume</button>`:''}${['running','paused','created'].includes(x.status)?`<button class="danger" onclick="command('${esc(x.id)}','cancel')">Cancel</button>`:''}</span></div>`).join(''):'<p class="muted">No swarms reported.</p>'}catch(e){document.querySelector('#stamp').textContent='telemetry unavailable'}}
function esc(v){const d=document.createElement('div');d.textContent=String(v);return d.innerHTML}refresh();setInterval(refresh,5000);
</script></body></html>
