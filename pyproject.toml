[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dlc-engineering-os"
version = "3.0.1"
description = "AI-DLC Engineering OS (by AgentShield): governed engineering memory and 26 specialist agents for Claude Code, Codex and VS Code over MCP"
authors = [{ name = "Jose Camargo" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=2,<3"]

[project.scripts]
ai-dlc-mcp = "ai_dlc_mcp.server:main"
agentshield = "ai_dlc_mcp.cli:main"
ai-dlc-admin = "ai_dlc_mcp.admin:main"
ai-dlc-install = "ai_dlc_mcp.installer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dlc_mcp", "src/agentshield_sdk"]

[tool.hatch.build.targets.wheel.force-include]
"apps/mission-control/index.html" = "ai_dlc_mcp/assets/mission-control.html"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
